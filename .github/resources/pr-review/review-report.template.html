<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../../../../../">
  <title>{{REPORT_TITLE}}</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f6f8fb;
      --surface: #ffffff;
      --code: #1e1e1e;
      --text: #1f2937;
      --muted: #5b6575;
      --border: #d9e0ea;
      --high: #b42318;
      --high-bg: #fff1f0;
      --medium: #9a6700;
      --medium-bg: #fff8e6;
      --low: #3f8f5b;
      --low-bg: #effaf1;
      --link: #3f8f5b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--text); font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 1680px; margin: 0 auto; padding: 48px 24px 64px; }
    article { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 36px 42px; box-shadow: 0 8px 24px rgba(31, 41, 55, 0.06); }
    h1, h2 { line-height: 1.25; }
    h1 { margin: 0 0 12px; font-size: 2rem; }
    h2 { margin: 36px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); font-size: 1.35rem; }
    p { margin: 8px 0 16px; }
    a { color: var(--link); }
    code { padding: 0.12em 0.35em; border-radius: 4px; background: #eef2f7; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.92em; }
    .metadata { color: var(--muted); }
    .finding { margin: 18px 0; padding: 16px 18px; border-left: 4px solid; border-radius: 6px; }
    .finding.high { border-color: var(--high); background: var(--high-bg); }
    .finding.medium { border-color: var(--medium); background: var(--medium-bg); }
    .finding.low { border-color: var(--low); background: var(--low-bg); }
    .finding summary { cursor: pointer; font-weight: 700; line-height: 1.4; }
    .severity-tag { display: inline-block; margin-right: 8px; padding: 0.15em 0.55em; border-radius: 999px; font-size: 0.75em; line-height: 1.35; letter-spacing: 0.04em; vertical-align: 0.08em; }
    .severity-tag.high { color: var(--high); background: #fde3e1; }
    .severity-tag.medium { color: var(--medium); background: #ffedb8; }
    .severity-tag.low { color: var(--low); background: #e5f6e8; }
    .ai-badge { display: inline; margin-right: 8px; background: transparent; border: 0; font-size: 16px; line-height: 1; vertical-align: -1px; }
    .finding-body { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
    .finding-description { order: 2; min-width: 0; font-size: 14px; }
    .finding-description p { margin: 0; }
    .section-text { font-size: 14px; }
    .code-panel { order: 1; min-width: 0; width: 100%; }
    .code-panel { overflow: hidden; border: 1px solid #3c3c3c; border-radius: 6px; background: var(--code); }
    .code-header { padding: 8px 12px; color: #cccccc; border-bottom: 1px solid #3c3c3c; background: #252526; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .code-panel pre code { padding: 0; background: transparent; color: #d4d4d4; }
    pre { margin: 0; padding: 16px; overflow-x: auto; color: #d4d4d4; font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; tab-size: 2; }
    ul { padding-left: 24px; }
    @media (max-width: 760px) {
      main { padding: 20px 12px 32px; }
      article { padding: 24px 20px; }
      h1 { font-size: 1.6rem; }
      .finding-body { display: flex; }
    }
  </style>
</head>
<body>
  <main>
    <article>
      <h1>{{REPORT_TITLE}}</h1>
      <p class="metadata">{{COMPARISON}}</p>
      <p class="metadata">Created (UTC): <time datetime="{{CREATED_AT_ISO}}">{{CREATED_AT}}</time> · Agent: <code>{{AGENT_NAME}}</code></p>

      <h2>Findings</h2>
      <!-- Repeat this block for each finding. Findings are expanded by default. -->
      {{FINDINGS}}

      <h2>Assumptions and validation</h2>
      <div class="section-text">{{ASSUMPTIONS}}</div>

      <h2>Summary</h2>
      <p class="section-text">{{SUMMARY}}</p>
    </article>
  </main>
</body>
</html>
